allowBuilds:
  '@embedded-postgres/linux-x64': false
  '@embedded-postgres/linux-arm64': false
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/darwin-arm64': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  unrs-resolver: true
  protobufjs: false
minimumReleaseAgeExclude:
  - nodemailer@10.1.6

# Compatible security patches for transitive validation and tooling dependencies.
overrides:
  "zod@>=4.0.0 <4.6.6": "4.6.7"
  "fast-uri@>=3.0.0 <3.1.9": "3.1.9"

name: Verify Sterlyn
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sterlyn
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: sterlyn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sterlyn -d sterlyn_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sterlyn:test-only@localhost:5432/sterlyn_test
      TEST_DATABASE_URL: postgresql://sterlyn:test-only@localhost:5432/sterlyn_test
      BETTER_AUTH_URL: http://localhost:3002
      PUBLIC_LAUNCH: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Validate Oracle deployment script
        run: bash -n scripts/deploy-oracle.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ephemeral acceptance authentication secret
        run: node --input-type=module -e 'import {appendFileSync} from "node:fs";import {randomBytes} from "node:crypto";appendFileSync(process.env.GITHUB_ENV,"BETTER_AUTH_SECRET="+randomBytes(48).toString("base64url")+"\nTRACKING_ENCRYPTION_KEY="+randomBytes(32).toString("hex")+"\n")'
      - run: pnpm exec prisma generate
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: RUN_DATABASE_TESTS=true pnpm exec vitest run tests/operations.integration.test.ts tests/product-management.integration.test.ts tests/showroom.integration.test.ts tests/notifications.integration.test.ts
      - run: pnpm exec tsx scripts/verify-migrations.ts
      - run: pnpm exec tsx scripts/verify-showroom-upgrade.ts
      - run: pnpm exec tsx scripts/verify-runtime-role.ts
      - run: pnpm audit --prod
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Acceptance journeys
        run: |
          pnpm exec tsx scripts/test-server.ts &
          for attempt in $(seq 1 30); do curl -fsS http://localhost:3002/api/health && break || sleep 2; done
          pnpm exec playwright test tests/e2e/product-management.spec.ts
          pnpm test:e2e --grep-invert 'nontechnical product editor publishes and moves products'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          path: |
            test-results/
            playwright-report/
            out/release-evidence/


  deploy:
    name: Approved Oracle production deployment
    needs: application
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    environment:
      name: production
      url: https://sterlynsupplies.com
    concurrency:
      group: sterlyn-oracle-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy verified commit
        shell: bash
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_DEPLOY_KEY: ${{ secrets.ORACLE_DEPLOY_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          for name in ORACLE_HOST ORACLE_USER ORACLE_DEPLOY_KEY ORACLE_KNOWN_HOSTS; do
            test -n "${!name}" || {
              echo "Missing required deployment secret: $name"
              exit 1
            }
          done

          umask 077
          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$ORACLE_DEPLOY_KEY" > "$HOME/.ssh/sterlyn_actions"
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/sterlyn_actions" "$HOME/.ssh/known_hosts"

          bash -n scripts/deploy-oracle.sh
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]

          ssh -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            -i "$HOME/.ssh/sterlyn_actions" \
            "$ORACLE_USER@$ORACLE_HOST" \
            "bash -se -- '$GITHUB_SHA'" \
            < scripts/deploy-oracle.sh

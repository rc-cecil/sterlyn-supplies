name: rcc-sterlyn

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: sterlyn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: sterlyn
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U sterlyn -d sterlyn
      interval: 10s
      timeout: 5s
      retries: 10

  storage:
    image: sterlyn-storage:local
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Storage username required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Storage password required}
    volumes:
      - storage_data:/data

  antivirus:
    image: sterlyn-antivirus:local
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2
    pids_limit: 128
    volumes:
      - antivirus_definitions:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 20

  processor:
    image: sterlyn-processor:local
    restart: unless-stopped
    network_mode: none
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 768m
    cpus: 2
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - media_spool:/spool

volumes:
  postgres_data:
  storage_data:
  antivirus_definitions:
  media_spool:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=512m,uid=1000,gid=1000,mode=0700"
